    <!-- 應用邏輯與 GA4 整合 -->
    <script>
        // ---------------------------------------------------------
        // 1. 商品資料設定
        // ---------------------------------------------------------
        const products = [
            {
                id: "room_eco_01",

                image: "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                desc: "小資族首選！高坪效設計，提供基本家具與獨立衛浴，讓您在有限預算內享有最高品質的私密空間。靠近學區與超商。",

            {
                id: "room_com_02",
                name: "舒適採光雙人房",
                price: 8500,
                category: "雙人房",
                image: "https://images.unsplash.com/photo-1598928506311-c55ded91a20c?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                desc: "適合朋友合租或情侶。擁有兩面大採光窗，室內明亮通風。配置雙人加大床墊與雙門大衣櫃，居住空間寬敞無壓迫感。",
                features: ["雙人加大床", "大衣櫃", "獨立衛浴", "獨立小冰箱", "冷氣"]
            },
            {
                id: "room_dlx_03",
                name: "豪華陽台大套房",
                price: 12000,
                category: "豪華房",
                image: "https://images.unsplash.com/photo-1502672260266-1c1de2d93688?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                desc: "高階主管或追求生活品質者的最愛。附設私人大陽台可晾衣或種植栽。乾濕分離衛浴與沙發休憩區，給您如家般的極致感受。",
                features: ["獨立大陽台", "乾濕分離衛浴", "沙發茶几", "個人洗衣機", "50吋液晶電視"]
            }
        ];

        // 購物車狀態
        let cart = [];

        // ---------------------------------------------------------
        // 2. UI 渲染功能
        // ---------------------------------------------------------
        
        // 格式化貨幣
        const formatMoney = (amount) => `NT$ ${amount.toLocaleString()}`;

        // 建立提示框 (取代 alert)
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-green-600' : 'bg-blue-600';
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-y-[-20px] flex items-center gap-2`;
            toast.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-[-20px]');
                toast.classList.add('opacity-100', 'translate-y-0');
            }, 10);

            // Animate out and remove
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 渲染商品列表
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition-shadow duration-300">
                    <div class="relative cursor-pointer group" onclick="openDetailModal('${product.id}')">
                        <img src="${product.image}" alt="${product.name}" loading="lazy" decoding="async" class="w-full h-48 sm:h-56 object-cover transform group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-300 flex items-center justify-center">
                            <span class="text-white opacity-0 group-hover:opacity-100 font-medium bg-black bg-opacity-50 px-4 py-2 rounded-lg backdrop-blur-sm transition-opacity duration-300">查看詳情</span>
                        </div>
                    </div>
                    <div class="p-5">
                        <div class="text-xs text-blue-600 font-bold mb-1">${product.category}</div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">${product.name}</h3>
                        <p class="text-gray-500 text-sm line-clamp-2 mb-4">${product.desc}</p>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-lg font-bold text-blue-600">${formatMoney(product.price)} <span class="text-sm font-normal text-gray-500">/ 月</span></span>
                            <button onclick="addToCart('${product.id}')" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-lg hover:bg-slate-800 transition shadow-sm">
                                加入清單
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 更新購物車 UI
        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            badge.innerText = cart.length;
            if (cart.length > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const container = document.getElementById('cart-items-container');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-10 flex flex-col items-center"><svg class="w-12 h-12 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg><p>目前沒有預約項目</p></div>`;
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.disabled = false;
                container.innerHTML = cart.map((item, index) => `
                    <div class="flex items-center p-3 bg-white border border-gray-100 rounded-lg shadow-sm">
                        <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-md">
                        <div class="ml-4 flex-1">
                            <h4 class="text-sm font-bold text-gray-900">${item.name}</h4>
                            <p class="text-sm text-blue-600 font-medium">${formatMoney(item.price)}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="p-2 text-red-500 hover:bg-red-50 rounded transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = formatMoney(total);
        }

        // ---------------------------------------------------------
        // 3. 事件互動與 GA4 追蹤邏輯
        // ---------------------------------------------------------

        // 格式化 GA4 商品格式
        function formatGA4Item(product) {
            return {
                item_id: product.id,
                item_name: product.name,
                item_category: product.category,
                price: product.price,
                quantity: 1
            };
        }

        // 1. 查看商品: view_item
        let currentDetailProduct = null;
        function openDetailModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            currentDetailProduct = product;
            
            document.getElementById('detail-image').src = product.image;
            document.getElementById('detail-title').innerText = product.name;
            document.getElementById('detail-price').innerText = `${formatMoney(product.price)} / 月`;
            document.getElementById('detail-desc').innerText = product.desc;
            
            document.getElementById('detail-features').innerHTML = product.features.map(f => 
                `<span class="px-3 py-1 bg-blue-50 text-blue-700 text-sm rounded-full border border-blue-100">${f}</span>`
            ).join('');

            // 設定加入按鈕的事件
            const addBtn = document.getElementById('detail-add-btn');
            addBtn.onclick = () => {
                addToCart(product.id);
                closeDetailModal();
            };

            // 觸發 GA4 事件: view_item
            gtag('event', 'view_item', {
                currency: 'TWD',
                value: product.price,
                items: [formatGA4Item(product)]
            });

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            currentDetailProduct = null;
        }

        // 2. 加入購物車: add_to_cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            cart.push(product);
            updateCartUI();
            showToast(`已將「${product.name}」加入預約清單`);

            // 觸發 GA4 事件: add_to_cart
            gtag('event', 'add_to_cart', {
                currency: 'TWD',
                value: product.price,
                items: [formatGA4Item(product)]
            });
        }

        // 3. 看購物車: view_cart
        document.getElementById('cart-btn').addEventListener('click', () => {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            
            // 觸發 GA4 事件: view_cart
            gtag('event', 'view_cart', {
                currency: 'TWD',
                value: total,
                items: cart.map(item => formatGA4Item(item))
            });

            document.getElementById('cart-modal').classList.remove('hidden');
        });

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        // 4. 從購物車移出: remove_from_cart
        function removeFromCart(index) {
            const itemToRemove = cart[index];
            cart.splice(index, 1);
            updateCartUI();

            // 觸發 GA4 事件: remove_from_cart
            gtag('event', 'remove_from_cart', {
                currency: 'TWD',
                value: itemToRemove.price,
                items: [formatGA4Item(itemToRemove)]
            });
        }

        // 5. 開始結帳: begin_checkout
        function startCheckout() {
            if (cart.length === 0) return;
            
            closeCartModal();
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            document.getElementById('checkout-modal').classList.remove('hidden');

            // 觸發 GA4 事件: begin_checkout
            gtag('event', 'begin_checkout', {
                currency: 'TWD',
                value: total,
                items: cart.map(item => formatGA4Item(item))
            });
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        // 返回購物車
        function backToCartFromCheckout() {
            closeCheckoutModal();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        // 6. 填寫並確認訂購與付款資訊: add_payment_info + purchase
        function completePurchase() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const bank5 = document.getElementById('cust-bank5').value.trim();

            if (!name || !phone || !address || !bank5) {
                showToast('請填寫完整的訂購與付款資訊', 'error');
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const transactionId = 'T_' + Math.random().toString(36).substr(2, 9).toUpperCase();

            // 觸發 GA4 事件: add_payment_info
            gtag('event', 'add_payment_info', {
                currency: 'TWD',
                value: total,
                payment_type: 'Bank Transfer',
                items: cart.map(item => formatGA4Item(item))
            });

            // 觸發 GA4 事件: purchase
            gtag('event', 'purchase', {
                transaction_id: transactionId,
                value: total,
                currency: 'TWD',
                items: cart.map(item => formatGA4Item(item))
            });

            // 關閉並清理
            closeCheckoutModal();
            cart = [];
            updateCartUI();
            
            // 顯示成功訊息 (自訂提示框)
            showToast(`預訂成功！您的預約編號為：${transactionId}`);
            
            // 清空表單
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-phone').value = '';
            document.getElementById('cust-address').value = '';
            document.getElementById('cust-bank5').value = '';
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();
        });

        // ---------------------------------------------------------
        // 4. PWA：Service Worker 註冊與安裝提示
        // ---------------------------------------------------------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service Worker 註冊失敗：', err);
                });
            });
        }

        let deferredInstallPrompt = null;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredInstallPrompt = event;
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            if (outcome === 'accepted') {
                showToast('感謝安裝！您可以從主畫面快速開啟本站。');
            }
            deferredInstallPrompt = null;
            installBtn.classList.add('hidden');
            installBtn.classList.remove('flex');
        });

        window.addEventListener('appinstalled', () => {
            installBtn.classList.add('hidden');
            installBtn.classList.remove('flex');
            deferredInstallPrompt = null;
        });
    </script>
</body>
</html>
